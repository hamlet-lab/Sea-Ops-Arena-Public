[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sea-ops-arena"
version = "0.1.0"
description = "Public benchmark harness for operational AI evaluation"
requires-python = ">=3.11"
license = {text = "Proprietary public source; no license grant implied"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
