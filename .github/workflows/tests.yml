name: 공개 테스트

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 테스트 환경 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: 공개 테스트 실행
        run: python -m pytest -q

      - name: 공개 릴리스 감사
        run: sea-ops-arena-audit --root .

      - name: 단일 평가 CLI 확인
        run: |
          sea-ops-arena \
            --suite examples/scenarios/public_suite_v2.json \
            --decisions examples/results/v2-balanced.public.json \
            --format json > /tmp/arena-result.json

      - name: 비교 CLI 확인
        run: |
          sea-ops-arena-compare \
            --suite examples/scenarios/public_suite_v2.json \
            --decisions \
              examples/decisions/v2-balanced.json \
              examples/decisions/v2-eager.json \
              examples/decisions/v2-cautious.json \
            > /tmp/arena-comparison.md

      - name: 반복 평가 CLI 확인
        run: |
          sea-ops-arena-repeat \
            --suite examples/scenarios/public_suite_v2.json \
            --results \
              examples/results/v2-balanced.public.json \
              examples/results/v2-repeat-002.public.json \
              examples/results/v2-repeat-003.public.json \
            > /tmp/arena-repeat.md

      - name: 공개 결과 템플릿 CLI 확인
        run: |
          sea-ops-arena-template \
            --suite examples/scenarios/public_suite_v2.json \
            --output /tmp/public-result-template.json \
            --label smoke-test \
            --kind model \
            --model-name public-example-model \
            --repeat-id smoke-001
